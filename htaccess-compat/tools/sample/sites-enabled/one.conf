<VirtualHost *:80>
    ServerName one.test
    ServerAlias www.one.test
    DocumentRoot /srv/one/public

    DirectoryIndex home.html index.html
    ErrorDocument 404 /missing.html

    RewriteEngine On
    RewriteRule ^/old$ /home.html [R=301,L]

    <Directory "/srv/one/public">
        AllowOverride AuthConfig Limit FileInfo
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ProxyPass /app http://127.0.0.1:3000/
    ErrorLog /var/log/apache2/one.log
</VirtualHost>
