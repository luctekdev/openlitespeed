# Comparação Apache x OLS sobre o mesmo docroot.
#
# Antes, gere a imagem do OLS a partir da raiz do repositório:
#   docker build -f htaccess-compat/docker/ols.Dockerfile --target runtime -t ols-htaccess:runtime .
#
# Depois, nesta pasta:
#   docker compose run --rm runner

services:
  apache:
    image: httpd:2.4
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - www:/www:ro

  ols:
    image: ${OLS_IMAGE:-ols-htaccess:runtime}
    environment:
      - LS_HTA_GRAVE_TICKS=${LS_HTA_GRAVE_TICKS:-60}
    volumes:
      - ./ols/httpd_config.conf:/usr/local/lsws/conf/httpd_config.conf:ro
      - ./ols/vhconf.conf:/usr/local/lsws/conf/vhosts/compat/vhconf.conf:ro
      - www:/www:ro

  runner:
    image: python:3.12-slim
    profiles: ["run"]
    working_dir: /compare
    command: ["python", "-B", "run.py", "--www", "/www", "--report", "/report/report.md"]
    depends_on:
      - apache
      - ols
    volumes:
      - ./:/compare:ro
      - ./report:/report
      - www:/www

  # Benchmark: mesmas vhosts das políticas. O cliente é o ab da imagem do Apache.
  # Garantias de segurança e modos de operação.
  ols-policy:
    image: ${OLS_IMAGE:-ols-htaccess:runtime}
    profiles: ["policy"]
    volumes:
      - ./ols/httpd_config_policy.conf:/usr/local/lsws/conf/httpd_config.conf:ro
      - ./ols/vhconf.conf:/usr/local/lsws/conf/vhosts/compat/vhconf.conf:ro
      - ./ols/policy_strict.conf:/usr/local/lsws/conf/vhosts/strict/vhconf.conf:ro
      - ./ols/policy_off.conf:/usr/local/lsws/conf/vhosts/off/vhconf.conf:ro
      - ./ols/policy_none.conf:/usr/local/lsws/conf/vhosts/none/vhconf.conf:ro
      - ./ols/policy_authonly.conf:/usr/local/lsws/conf/vhosts/authonly/vhconf.conf:ro
      - ./ols/policy_proxy.conf:/usr/local/lsws/conf/vhosts/proxy/vhconf.conf:ro
      - ./ols/policy_bench.conf:/usr/local/lsws/conf/vhosts/bench/vhconf.conf:ro
      - www:/www:ro

  # Comparação com PHP. Gere antes a imagem --target php.
  apache-php:
    image: php:8.3-apache
    profiles: ["php"]
    command: ["sh", "-c", "a2enmod rewrite headers expires >/dev/null && cp /compare/apache/php.conf /etc/apache2/sites-enabled/000-default.conf && exec apache2-foreground"]
    volumes:
      - ./:/compare:ro
      - www:/www:ro

  ols-php:
    image: ${OLS_PHP_IMAGE:-ols-htaccess:php}
    profiles: ["php"]
    # lsphp roda à parte: o processo cgid não consegue iniciá-lo neste contêiner.
    command: ["sh", "-c", "su -s /bin/sh nobody -c 'PHP_LSAPI_CHILDREN=8 /usr/local/lsws/lsphp83/bin/lsphp -b /tmp/lsphp.sock &' && exec /usr/local/lsws/bin/openlitespeed -n"]
    volumes:
      - ./ols/httpd_config_php.conf:/usr/local/lsws/conf/httpd_config.conf:ro
      - ./ols/vhconf_php.conf:/usr/local/lsws/conf/vhosts/compat/vhconf.conf:ro
      - www:/www:ro

  runner-php:
    image: python:3.12-slim
    profiles: ["php"]
    working_dir: /compare
    command: ["python", "-B", "run.py", "--www", "/www", "--report", "/report/report-php.md", "--apache", "apache-php", "--ols", "ols-php", "--corpus", "php"]
    depends_on:
      - apache-php
      - ols-php
    volumes:
      - ./:/compare:ro
      - ./report:/report
      - www:/www

volumes:
  www:
