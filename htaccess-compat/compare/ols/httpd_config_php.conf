# OLS com PHP via LSAPI.
serverName              compat
user                    nobody
group                   nogroup
autoRestart             0
disableWebAdmin         1
mime                    conf/mime.properties
indexFiles              index.html
showVersionNumber       0

errorlog logs/error.log {
    logLevel            INFO
    enableStderrLog     1
}

accessLog logs/access.log {
    logReferer          0
    logUserAgent        0
}

tuning {
    enableGzipCompress  0
    enableBrCompress    0
    quicEnable          0
}

fileAccessControl {
    followSymbolLink    1
    checkSymbolLink     0
    requiredPermissionMask    000
    restrictedPermissionMask  000
}

accessControl {
    allow               ALL
    deny
}

extProcessor lsphp {
    type                lsapi
    address             uds://tmp/lsphp.sock
    maxConns            10
    env                 PHP_LSAPI_CHILDREN=10
    initTimeout         60
    retryTimeout        0
    persistConn         1
    respBuffer          0
    autoStart           0
    path                /usr/local/lsws/lsphp83/bin/lsphp
    backlog             100
    instances           1
}

scriptHandler {
    add                 lsapi:lsphp php
}

virtualhost compat {
    vhRoot              /www/
    configFile          conf/vhosts/compat/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

listener http {
    address             *:80
    secure              0
    map                 compat *
}
