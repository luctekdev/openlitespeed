docRoot                 /www/

index {
    useServer           0
    indexFiles          index.html
    autoIndex           0
}

errorlog /usr/local/lsws/logs/compat-error.log {
    useServer           1
}

rewrite {
    enable              1
    autoLoadHtaccess    1
    htaccessCheckInterval 0
    htaccessAllowOverride AuthConfig
}
