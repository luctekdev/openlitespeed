# Várias vhosts com o mesmo docroot, cada uma com uma política de .htaccess.
serverName              compat
user                    nobody
group                   nogroup
autoRestart             0
disableWebAdmin         1
mime                    conf/mime.properties
indexFiles              index.html

errorlog logs/error.log {
    logLevel            INFO
}

accessLog logs/access.log {
}

tuning {
    enableGzipCompress  0
    enableBrCompress    0
    quicEnable          0
}

accessControl {
    allow               ALL
    deny
}

virtualhost compat {
    vhRoot              /www/
    configFile          conf/vhosts/compat/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

virtualhost strict {
    vhRoot              /www/
    configFile          conf/vhosts/strict/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

virtualhost off {
    vhRoot              /www/
    configFile          conf/vhosts/off/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

virtualhost none {
    vhRoot              /www/
    configFile          conf/vhosts/none/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

virtualhost authonly {
    vhRoot              /www/
    configFile          conf/vhosts/authonly/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

virtualhost proxy {
    vhRoot              /www/
    configFile          conf/vhosts/proxy/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

listener http {
    address             *:80
    secure              0
    map                 compat compat
    map                 strict strict
    map                 off off
    map                 none none
    map                 authonly authonly
    map                 proxy proxy
}
