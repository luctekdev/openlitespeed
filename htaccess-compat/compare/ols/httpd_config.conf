# Configuração mínima do OLS para a comparação com o Apache.
serverName              compat
user                    nobody
group                   nogroup
autoRestart             0
disableWebAdmin         1
mime                    conf/mime.properties
indexFiles              index.html
showVersionNumber       0

errorlog logs/error.log {
    logLevel            INFO
    enableStderrLog     1
}

accessLog logs/access.log {
    logReferer          0
    logUserAgent        0
}

tuning {
    enableGzipCompress  0
    enableBrCompress    0
    quicEnable          0
}

fileAccessControl {
    followSymbolLink    1
    checkSymbolLink     0
    requiredPermissionMask    000
    restrictedPermissionMask  000
}

accessControl {
    allow               ALL
    deny
}

virtualhost compat {
    vhRoot              /www/
    configFile          conf/vhosts/compat/vhconf.conf
    allowSymbolLink     1
    enableScript        1
    restrained          0
}

listener http {
    address             *:80
    secure              0
    map                 compat *
}
